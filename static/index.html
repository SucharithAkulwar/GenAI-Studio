<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenAI Studio — Laboratory & Experiment Platform</title>
  <meta name="description" content="GenAI Studio: An interactive, clean laboratory workbench running all 10 Generative AI experiments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="theme-light">
  <!-- Horizontal Top Navbar -->
  <header class="top-nav" id="top-nav">
    <div class="top-nav-inner">
      <!-- Left: Brand -->
      <a href="#home" class="brand-link" id="brand-link">
        <span class="brand-title">GenAI Studio<span class="brand-dot">.</span></span>
      </a>

      <!-- Center: Navigation Links & Dropdown -->
      <nav class="nav-links">
        <a href="#home" class="top-nav-link active" data-id="home" id="nav-home">Overview</a>
        
        <!-- Experiments Dropdown -->
        <div class="nav-dropdown" id="exp-dropdown-container">
          <button class="top-nav-link dropdown-toggle" id="exp-dropdown-btn" type="button" aria-haspopup="true" aria-expanded="false">
            <span>Experiments</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu" id="exp-dropdown-menu">
            <div class="dropdown-header">
              <input type="text" id="exp-search" placeholder="Filter experiments..." class="dropdown-search" aria-label="Filter experiments">
            </div>
            <div class="dropdown-items-list" id="experiments-nav-list"></div>
          </div>
        </div>

        <a href="https://github.com/SucharithAkulwar/GenAI-Studio" target="_blank" rel="noopener noreferrer" class="top-nav-link external-link">
          <span>Repository</span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
        </a>
      </nav>

      <!-- Right: Theme & CTA -->
      <div class="top-nav-actions">
        <button class="theme-btn" id="theme-toggle" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="#exp-1" class="btn-primary btn-nav-cta">
          <span>Launch Lab</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
        </a>
        <button id="mobile-menu-btn" class="menu-btn mobile-only" aria-label="Toggle menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Drawer -->
  <div class="mobile-drawer hidden" id="mobile-drawer">
    <div class="mobile-drawer-inner">
      <input type="text" id="mobile-search-input" placeholder="Search 10 experiments..." class="form-input" style="margin-bottom: 12px;">
      <div class="mobile-nav-list" id="mobile-nav-list"></div>
    </div>
  </div>

  <!-- Main Container -->
  <main class="main-content" id="main-content" role="main">
    <div class="content-container" id="content-container"></div>
  </main>

  <div id="toast" class="toast hidden" role="alert"></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
